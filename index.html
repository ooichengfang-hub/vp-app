<style>

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.btn-r{width:100%;margin-top:18px;padding:12px;border-radius:12px;background:var(--card);color:var(--dn);font-size:15px}
@media (max-width:820px){
  main{grid-template-columns:1fr;height:auto;gap:12px;padding:12px max(12px,env(safe-area-inset-right)) 20px max(12px,env(safe-area-inset-left))}
  .card{height:max(320px,calc((100svh - 100px)/2));min-height:320px}
  .bar{gap:10px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left))}
  #last{font-size:19px}.brand b{font-size:15px}.px{margin-left:0}

  .seg button{padding:4px 8px}
  .scrim{align-items:flex-end}
  .sheet{width:100%;border-radius:20px 20px 0 0;max-height:88vh;padding-bottom:max(18px,env(safe-area-inset-bottom))}
}

  <section class="card" id="w1">

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-label="设置">
    <div class="sh-h"><h3>设置</h3><button id="setDone">完成</button></div>

      <div class="rowi"><label for="c_vp">显示</label><span class="sw"><input type="checkbox" id="c_vp" data-k="vp"><i></i></span></div>
      <div class="rowi"><label>分层数</label><span class="step"><button data-d="-4" data-f="rows">−</button><input id="c_rows" data-k="rows" type="number" min="8" max="80" inputmode="numeric"><button data-d="4" data-f="rows">+</button></span></div>
      <div class="rowi"><label>价值区 %</label><span class="step"><button data-d="-5" data-f="va">−</button><input id="c_va" data-k="va" type="number" min="50" max="95" inputmode="numeric"><button data-d="5" data-f="va">+</button></span></div>
      <div class="rowi"><label for="c_vaLines">显示 VAH / VAL 线</label><span class="sw"><input type="checkbox" id="c_vaLines" data-k="vaLines"><i></i></span></div>
    </div>
    <div class="foot">每个整点小时（UTC+8，例如 14:00–15:00）一个独立分布。蓝色为 POC（成交最集中的价位），深色区为价值区。数据由 1 分钟K线估算：每根K线的成交额平均分配到它的最高–最低价之间，不是逐笔成交。较早的小时最多回溯 14 天。</div>
    <div class="grp-t">成交量均线</div>

      <div class="rowi"><label for="c_ma">显示</label><span class="sw"><input type="checkbox" id="c_ma" data-k="ma"><i></i></span></div>
      <div class="rowi"><label>周期</label><span class="step"><button data-d="-1" data-f="maN">−</button><input id="c_maN" data-k="maN" type="number" min="2" max="200" inputmode="numeric"><button data-d="1" data-f="maN">+</button></span></div>
    </div>
    <div class="foot">成交量单位：USDT 成交额。时间均为 UTC+8。</div>

  </div>

<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
// 每小时成交量分布（VP）核心：纯函数，浏览器和 node 单元测试共用
const VPC=(function(){
  // bars: 该小时内的 1 分钟K线 [{ts,o,h,l,c,v}]；每根成交额按高低区间均匀分配到各层
  function profile(bars,rows,vaPct){ rows=Math.max(2,rows|0); if(!bars||!bars.length) return null;
    let lo=Infinity,hi=-Infinity; for(const b of bars){ if(b.l<lo) lo=b.l; if(b.h>hi) hi=b.h; }
    if(!(hi>lo)) hi=lo+Math.max(Math.abs(lo)*1e-6,1e-9);
    const st=(hi-lo)/rows, vol=new Float64Array(rows), up=new Float64Array(rows); let tot=0;
    for(const b of bars){ const v=+b.v; if(!(v>0)) continue; tot+=v; const u=b.c>=b.o;
      if(!(b.h>b.l)){ const k=Math.min(rows-1,Math.max(0,Math.floor((b.l-lo)/st))); vol[k]+=v; if(u) up[k]+=v; continue; }
      const k0=Math.max(0,Math.floor((b.l-lo)/st)), k1=Math.min(rows-1,Math.ceil((b.h-lo)/st)-1), span=b.h-b.l;
      for(let k=k0;k<=k1;k++){ const a=Math.max(b.l,lo+k*st), z=Math.min(b.h,lo+(k+1)*st); if(z>a){ const x=v*(z-a)/span; vol[k]+=x; if(u) up[k]+=x; } } }
    if(!(tot>0)) return null;
    // POC：量最大的一层；同量取离中间近的
    let poc=0, max=-1; const mid=(rows-1)/2; for(let k=0;k<rows;k++){ const v=vol[k]; if(v>max+1e-9*tot||(Math.abs(v-max)<=1e-9*tot&&Math.abs(k-mid)<Math.abs(poc-mid))){ if(v>max) max=v; poc=k; } }
    max=vol[poc];
    // 价值区：从 POC 往量大的一边逐层扩，直到 ≥ vaPct%
    let a=poc, z=poc, acc=vol[poc]; const need=tot*(vaPct||70)/100;
    while(acc<need-1e-9*tot){ const dn=a>0?vol[a-1]:-1, upv=z<rows-1?vol[z+1]:-1; if(dn<0&&upv<0) break; if(upv>=dn){ z++; acc+=vol[z]; } else { a--; acc+=vol[a]; } }
    return {lo,hi,st,rows,vol,up,tot,max,poc,a,z,va:acc/tot,pocP:lo+(poc+0.5)*st,vah:lo+(z+1)*st,val:lo+a*st,n:bars.length}; }
  function sma(vals,n){ const out=new Array(vals.length).fill(null); let s=0; for(let i=0;i<vals.length;i++){ s+=vals[i]; if(i>=n) s-=vals[i-n]; if(i>=n-1) out[i]=s/n; } return out; }
  const lowerIdx=(a,t)=>{ let l=0,h=a.length; while(l<h){ const m=(l+h)>>1; if(a[m].ts<t) l=m+1; else h=m; } return l; };
  return {profile,sma,lowerIdx};
})();
if(typeof module!=='undefined') module.exports=VPC;

</script>
<script>
'use strict';
const $=id=>document.getElementById(id), sleep=ms=>new Promise(r=>setTimeout(r,ms)), nowS=()=>Date.now()/1000;
const SYM='BTC-USDT-SWAP', API='https://www.okx.com/api/v5/', TZ=8*3600, ct=t=>t+TZ;
const SEC={'1m':60,'3m':180,'5m':300,'15m':900,'30m':1800,'1H':3600}, LTFS=['1m','3m','5m','15m','30m'];
const TFN={'1m':'1 分钟','3m':'3 分钟','5m':'5 分钟','15m':'15 分钟','30m':'30 分钟'}, TFS={'1m':'1分','3m':'3分','5m':'5分','15m':'15分','30m':'30分'};
const SPACING={'1m':4,'3m':6,'5m':9,'15m':14,'30m':22};
const M1_CAP_DAYS=14, KEY='vp2_cfg', DEF={tf:'5m',vp:true,rows:24,va:70,vaLines:true,ma:true,maN:20};
const LIMS={rows:[8,80],va:[50,95],maN:[2,200]};
const FONT='-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC",system-ui,sans-serif';
const p2=n=>String(n).padStart(2,'0');
const tStr=t=>{ const d=new Date((t+TZ)*1000); return `${p2(d.getUTCMonth()+1)}-${p2(d.getUTCDate())} ${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const hh=t=>{ const d=new Date((t+TZ)*1000); return `${p2(d.getUTCHours())}:00`; };
const fmtP=p=>p==null||!isFinite(p)?'—':(+p).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmtV=v=>{ if(v==null||!isFinite(v)) return '—'; const a=Math.abs(v); return a>=1e9?(v/1e9).toFixed(2)+'B':a>=1e6?(v/1e6).toFixed(2)+'M':a>=1e3?(v/1e3).toFixed(1)+'K':v.toFixed(0); };
const hourOf=t=>Math.floor(t/3600)*3600;

// ---------- 设置 ----------
function loadCfg(){ let c={}; try{ c=JSON.parse(localStorage.getItem(KEY)||'{}')||{}; }catch(e){} c=Object.assign({},DEF,c); if(!LTFS.includes(c.tf)) c.tf=DEF.tf;
  for(const k in LIMS){ c[k]=Math.round(Math.min(LIMS[k][1],Math.max(LIMS[k][0],+c[k]||DEF[k]))); } for(const k of ['vp','vaLines','ma']) c[k]=!!c[k]; return c; }
let CFG=loadCfg(), CFGV=1; const saveCfg=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(CFG)); }catch(e){} };

// ---------- OKX REST（限流 8 次/秒） ----------
const LIM=[];
async function okx(path){ for(let k=0;k<5;k++){
    for(;;){ const t=Date.now(); while(LIM.length&&t-LIM[0]>=1000) LIM.shift(); if(LIM.length<8) break; await sleep(1005-(t-LIM[0])); }
    LIM.push(Date.now()); let j;
    try{ j=await (await fetch(API+path)).json(); }catch(e){ await sleep(700*(k+1)); continue; }
    if(j.code==='0') return j.data; if(j.code==='50011'){ await sleep(800*(k+1)); continue; }
    throw new Error('OKX '+j.code+' '+(j.msg||'')); }
  throw new Error('网络错误'); }
const row=a=>({ts:+a[0]/1000,o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[7]>0?+a[7]:(+a[5])*(+a[4])});
const merge=(a,b)=>{ const m=new Map(); for(const x of a) m.set(x.ts,x); for(const x of b) m.set(x.ts,x); return [...m.values()].sort((p,q)=>p.ts-q.ts); };
const latest=async(tf,n)=>(await okx(`market/candles?instId=${SYM}&bar=${tf}&limit=${n||300}`)).map(row).reverse();
const older=async(tf,before)=>(await okx(`market/history-candles?instId=${SYM}&bar=${tf}&after=${before*1000}&limit=300`)).map(row).filter(b=>b.ts<before).reverse();

// ---------- 主题 ----------
const hexA=(h,a)=>{ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; };
function readTheme(){ const s=getComputedStyle(document.documentElement), g=k=>s.getPropertyValue(k).trim();
  const t={text:g('--sub'),grid:g('--grid'),line:g('--line'),accent:g('--accent'),up:g('--up'),dn:g('--dn'),vp:g('--vp'),dark:matchMedia('(prefers-color-scheme: dark)').matches};
  t.upA=hexA(t.up,t.dark?.45:.38); t.dnA=hexA(t.dn,t.dark?.45:.38); t.accA=a=>hexA(t.accent,a); return t; }
let T=readTheme();

// ---------- 1 分钟数据（VP 的来源） ----------
const M1={bars:[],ver:0,busy:false,end:false,want:null};
const PC=new Map(); // 小时 → 分布缓存
function prof(H){ const bs=M1.bars; if(!bs.length||bs[0].ts>H) return null;
  const live=H+3600>nowS(), c=PC.get(H); if(c&&c.cv===CFGV&&(!live||c.dv===M1.ver)) return c.p;
  const i=VPC.lowerIdx(bs,H), j=VPC.lowerIdx(bs,H+3600); const p=i<j?VPC.profile(bs.slice(i,j),CFG.rows,CFG.va):null;
  if(p) p.H=H; PC.set(H,{p,cv:CFGV,dv:M1.ver}); return p; }
function upM1(b){ const bs=M1.bars, n=bs.length; if(!n||b.ts>bs[n-1].ts) bs.push(b); else if(b.ts===bs[n-1].ts) bs[n-1]=b; else { const i=VPC.lowerIdx(bs,b.ts); if(bs[i]&&bs[i].ts===b.ts) bs[i]=b; else bs.splice(i,0,b); PC.delete(hourOf(b.ts)); } M1.ver++; }
async function loadM1Until(t){ t=Math.max(hourOf(t),hourOf(nowS()-M1_CAP_DAYS*86400));
  if(M1.busy){ M1.want=Math.min(M1.want??Infinity,t); return; } M1.busy=true;
  try{ while(M1.bars.length&&M1.bars[0].ts>t&&!M1.end){ const b=await older('1m',M1.bars[0].ts); if(!b.length){ M1.end=true; break; } M1.bars=b.concat(M1.bars); M1.ver++; status('载入成交量分布 · '+tStr(M1.bars[0].ts)); } }
  catch(e){ console.warn('1m 载入失败',e); }
  finally{ M1.busy=false; status(''); }
  if(M1.want!=null){ const w=M1.want; M1.want=null; if(M1.bars.length&&w<M1.bars[0].ts) loadM1Until(w); } }

// ---------- 图表窗口 ----------
function chartOpts(){ return {autoSize:true,layout:{background:{type:'solid',color:'transparent'},textColor:T.text,fontFamily:FONT,fontSize:11},
  grid:{vertLines:{visible:false},horzLines:{color:T.grid}},rightPriceScale:{borderVisible:false,scaleMargins:{top:innerWidth<=820?0.24:0.12,bottom:0.24}},
  timeScale:{borderVisible:false,timeVisible:true,secondsVisible:false,rightOffset:4,minBarSpacing:1},
  crosshair:{mode:0,vertLine:{color:T.line,width:1,style:2,labelBackgroundColor:T.accent},horzLine:{color:T.line,width:1,style:2,labelBackgroundColor:T.accent}},
  localization:{locale:'zh-CN',priceFormatter:fmtP,timeFormatter:t=>tStr(t-TZ)},handleScroll:{vertTouchDrag:false}}; }
function mkWin(key,el,tfFn,spacing){ const body=el.querySelector('.body');
  const w={key,el,body,cvU:body.querySelector('canvas.vp'),cvO:body.querySelector('canvas.ov'),lg:body.querySelector('.lg'),tfFn,bars:[],end:false,busy:false,gen:0,ver:0,sig:'',hov:null,lgDirty:true,drawn:0};
  Object.defineProperty(w,'tf',{get:tfFn});
  w.chart=LightweightCharts.createChart(body.querySelector('.chart'),chartOpts()); w.chart.timeScale().applyOptions({barSpacing:spacing});
  w.cs=w.chart.addCandlestickSeries({upColor:T.up,downColor:T.dn,wickUpColor:T.up,wickDownColor:T.dn,borderVisible:false,priceLineWidth:1,priceLineStyle:2});
  w.vs=w.chart.addHistogramSeries({priceScaleId:'v',priceFormat:{type:'volume'},lastValueVisible:false,priceLineVisible:false});
  w.ma=w.chart.addLineSeries({priceScaleId:'v',color:T.accent,lineWidth:1,lastValueVisible:false,priceLineVisible:false,crosshairMarkerVisible:false});
  w.chart.priceScale('v').applyOptions({scaleMargins:{top:0.8,bottom:0}});
  w.chart.timeScale().subscribeVisibleLogicalRangeChange(()=>{ w.sig=''; schedEnsure(); });
  w.chart.subscribeCrosshairMove(p=>{ const h=p&&p.point&&p.logical!=null?Math.round(p.logical):null; if(h!==w.hov){ w.hov=h; w.lgDirty=true; } });
  return w; }
const cBar=x=>({time:ct(x.ts),open:x.o,high:x.h,low:x.l,close:x.c}), vBar=x=>({time:ct(x.ts),value:x.v,color:x.c>=x.o?T.upA:T.dnA});
function render(w){ const b=w.bars; w.cs.setData(b.map(cBar)); w.vs.setData(b.map(vBar)); setMa(w); w.ver++; w.sig=''; w.lgDirty=true; }
function setMa(w){ if(!CFG.ma){ w.ma.setData([]); return; } const m=VPC.sma(w.bars.map(x=>x.v),CFG.maN); w.ma.setData(w.bars.map((x,i)=>m[i]==null?{time:ct(x.ts)}:{time:ct(x.ts),value:m[i]})); }
function maAt(w,i){ const n=CFG.maN; if(!CFG.ma||i<n-1) return null; let s=0; for(let k=i-n+1;k<=i;k++) s+=w.bars[k].v; return s/n; }
function live(w,b){ const bs=w.bars, n=bs.length; if(!n||b.ts<bs[n-1].ts) return; if(bs[n-1].ts===b.ts) bs[n-1]=b; else bs.push(b);
  w.cs.update(cBar(b)); w.vs.update(vBar(b)); const m=maAt(w,bs.length-1); if(m!=null) w.ma.update({time:ct(b.ts),value:m}); w.ver++; w.sig=''; if(w.hov==null) w.lgDirty=true; }
async function loadWin(w){ const g=++w.gen, tf=w.tf; w.end=false; w.busy=false;
  const b=await latest(tf,300); if(g!==w.gen) return false; w.bars=b; render(w); w.chart.timeScale().scrollToRealTime(); return true; }
async function loadOlderWin(w){ if(w.busy||w.end||!w.bars.length) return; w.busy=true; const g=w.gen;
  try{ const b=await older(w.tf,w.bars[0].ts); if(g!==w.gen) return; if(!b.length){ w.end=true; return; }
    const ts=w.chart.timeScale(), vr=ts.getVisibleLogicalRange(); w.bars=b.concat(w.bars); render(w); if(vr) ts.setVisibleLogicalRange({from:vr.from+b.length,to:vr.to+b.length}); }
  catch(e){ console.warn(e); } finally{ if(g===w.gen) w.busy=false; } }
let ensT=0; const schedEnsure=()=>{ clearTimeout(ensT); ensT=setTimeout(ensure,250); };
function ensure(){ if(!READY) return; for(const w of WS){ const vr=w.chart.timeScale().getVisibleLogicalRange(); if(!vr||!w.bars.length) continue;
    if(vr.from<20) loadOlderWin(w);
    const t=w.bars[Math.min(w.bars.length-1,Math.max(0,Math.floor(vr.from)))].ts; if(CFG.vp&&M1.bars.length&&t<M1.bars[0].ts&&!M1.end) loadM1Until(t); } }

// ---------- 画 VP ----------
function fit(cv,w,h){ const d=window.devicePixelRatio||1; if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){ cv.width=Math.round(w*d); cv.height=Math.round(h*d); cv.style.width=w+'px'; cv.style.height=h+'px'; } const x=cv.getContext('2d'); x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,w,h); return x; }
function bars(x,w,p,x0,maxLen,alpha){ const Y=v=>w.cs.priceToCoordinate(v), vp=T.vp;
  for(let k=0;k<p.rows;k++){ const v=p.vol[k]; if(!(v>0)) continue; const yt=Y(p.lo+(k+1)*p.st), yb=Y(p.lo+k*p.st); if(yt==null||yb==null) continue;
    const h=yb-yt, gap=h>3?1:0, L=Math.max(1,maxLen*v/p.max), inVa=k>=p.a&&k<=p.z;
    x.fillStyle=k===p.poc?T.accA(alpha[2]):`rgba(${vp},${inVa?alpha[1]:alpha[0]})`; x.fillRect(x0,yt+gap*0.5,L,Math.max(1,h-gap)); } }
function hline(x,y,x0,x1,col,wid,dash){ if(y==null) return; x.strokeStyle=col; x.lineWidth=wid; x.setLineDash(dash||[]); x.beginPath(); x.moveTo(x0,Math.round(y)+0.5); x.lineTo(x1,Math.round(y)+0.5); x.stroke(); x.setLineDash([]); }
function draw(w){ const W0=w.body.clientWidth, H0=w.body.clientHeight, ts=w.chart.timeScale(), vr=ts.getVisibleLogicalRange(), bs=w.bars;
  const ref=bs.length?bs[bs.length-1].c:1, sp=ts.options().barSpacing;
  const sig=[W0,H0,vr?vr.from.toFixed(2)+','+vr.to.toFixed(2):'',w.cs.priceToCoordinate(ref),w.cs.priceToCoordinate(ref*1.01),sp,w.ver,M1.ver,CFGV,T.dark].join('|');
  if(sig===w.sig) return; w.sig=sig;
  const u=fit(w.cvU,W0,H0), o=fit(w.cvO,W0,H0); w.drawn=0; if(!vr||!bs.length) return;
  const pw=ts.width(), ph=H0-ts.height(); for(const x of [u,o]){ x.save(); x.beginPath(); x.rect(0,0,pw,ph); x.clip(); }
  const a=Math.max(0,Math.floor(vr.from)), z=Math.min(bs.length-1,Math.ceil(vr.to)), Y=v=>w.cs.priceToCoordinate(v), vpc=T.vp;
  if(w.key==='h'){ // 1 小时：每根K线自己的分布
    if(CFG.vp&&sp>=3) for(let i=a;i<=z;i++){ const p=prof(bs[i].ts); if(!p) continue; const xc=ts.logicalToCoordinate(i); if(xc==null) continue;
      const x0=xc-sp/2+0.5, x1=xc+sp/2-0.5; bars(o,w,p,x0,(x1-x0),[.16,.30,.6]); hline(o,Y(p.pocP),x0,x1,T.accent,sp>=8?1.5:1);
      if(CFG.vaLines&&sp>=10){ hline(o,Y(p.vah),x0,x1,`rgba(${vpc},.75)`,1,[2,2]); hline(o,Y(p.val),x0,x1,`rgba(${vpc},.75)`,1,[2,2]); } w.drawn++; }
  } else { // 小周期：每个整点小时一块
    const tfS=SEC[w.tf], per=3600/tfS; for(let H=hourOf(bs[a].ts);H<=bs[z].ts;H+=3600){ const i=VPC.lowerIdx(bs,H); if(i>=bs.length) break; const xc=ts.logicalToCoordinate(i); if(xc==null) continue;
      const x0=xc-sp/2-((bs[i].ts-H)/tfS)*sp, x1=x0+per*sp; if(x1<0||x0>pw) continue;
      u.fillStyle=T.line; u.fillRect(Math.round(x0),0,1,ph);
      if(!CFG.vp) continue; const p=prof(H); if(!p) continue; const bw=x1-x0;
      bars(u,w,p,x0+1,bw*0.8,[.14,.28,.5]); hline(o,Y(p.pocP),x0,x1,T.accA(.9),1);
      if(CFG.vaLines){ hline(u,Y(p.vah),x0,x1,`rgba(${vpc},.6)`,1,[3,3]); hline(u,Y(p.val),x0,x1,`rgba(${vpc},.6)`,1,[3,3]); }
      w.drawn++; } }
  for(const x of [u,o]) x.restore(); }
function legend(w){ w.lgDirty=false; const bs=w.bars; if(!bs.length){ w.lg.textContent=''; return; }
  const i=w.hov!=null&&w.hov>=0&&w.hov<bs.length?w.hov:bs.length-1, b=bs[i], m=maAt(w,i), H=hourOf(b.ts), p=CFG.vp?prof(H):null, cls=b.c>=b.o?'up':'dn';
  w.lg.innerHTML=`<div><span class="t">${tStr(b.ts)}</span>开 <b>${fmtP(b.o)}</b> 高 <b>${fmtP(b.h)}</b> 低 <b>${fmtP(b.l)}</b> 收 <b class="${cls}">${fmtP(b.c)}</b></div>`+
    `<div>量 <b>${fmtV(b.v)}</b>${m!=null?` · MA${CFG.maN} <b class="acc">${fmtV(m)}</b>`:''}</div>`+
    (p?`<div>${hh(H)}–${hh(H+3600)} · POC <b class="acc">${fmtP(p.pocP)}</b> · VAH <b>${fmtP(p.vah)}</b> · VAL <b>${fmtP(p.val)}</b></div>`:''); }
function loop(){ for(const w of WS){ try{ draw(w); if(w.lgDirty) legend(w); }catch(e){ console.error(e); } } requestAnimationFrame(loop); }

// ---------- 实时 ----------
let ws=null, pingT=0, retry=0, wsDown=false, open24=null;
function setConn(on){ $('conn').classList.toggle('on',on); $('conn').title=on?'实时连接中':'重新连接中…'; }
function sub(op,tfs){ if(ws&&ws.readyState===1) ws.send(JSON.stringify({op,args:tfs.map(t=>({channel:'candle'+t,instId:SYM}))})); }
function connect(){ const port=retry%2?':8443':''; let s; try{ s=new WebSocket(`wss://ws.okx.com${port}/ws/v5/business`); }catch(e){ return reconnect(); } ws=s;
  s.onopen=()=>{ retry=0; setConn(true); sub('subscribe',[...new Set(['1m','1H',CFG.tf])]); clearInterval(pingT); pingT=setInterval(()=>{ try{ s.send('ping'); }catch(e){} },20000); if(wsDown){ wsDown=false; resync(); } };
  s.onmessage=e=>{ if(e.data==='pong') return; let m; try{ m=JSON.parse(e.data); }catch(x){ return; } if(!m.data||!m.arg||!m.arg.channel) return; const tf=m.arg.channel.slice(6); for(const a of m.data) onBar(tf,row(a)); };
  s.onclose=s.onerror=()=>{ if(ws!==s) return; s.onclose=s.onerror=s.onmessage=null; try{ s.close(); }catch(e){} ws=null; clearInterval(pingT); setConn(false); wsDown=true; reconnect(); }; }
function reconnect(){ retry++; setTimeout(connect,Math.min(15000,800*retry)); }
function onBar(tf,b){ if(tf==='1m'){ upM1(b); price(b.c); } if(tf==='1H') live(WH,b); if(tf===CFG.tf) live(WL,b); }
async function resync(){ try{ const [m,h,l]=await Promise.all([latest('1m',300),latest('1H',100),latest(CFG.tf,300)]); M1.bars=merge(M1.bars,m); PC.clear(); M1.ver++; WH.bars=merge(WH.bars,h); render(WH); if(l.length&&WL.bars.length) { WL.bars=merge(WL.bars,l); render(WL); } }catch(e){ console.warn(e); } }
function price(c){ $('last').textContent=fmtP(c); document.title=fmtP(c)+' · BTC 每小时 VP'; if(open24){ const r=c/open24-1; $('chg').textContent=(r>=0?'+':'')+(r*100).toFixed(2)+'%'; $('chg').className=r>=0?'up':'dn'; } }
async function ticker(){ try{ const d=await okx(`market/ticker?instId=${SYM}`); if(d[0]){ open24=+d[0].open24h; price(+d[0].last); } }catch(e){} }
let stT=0; function status(s){ clearTimeout(stT); if(s) $('st').textContent=s; else stT=setTimeout(()=>$('st').textContent='',600); }

// ---------- 交互 ----------
function setTf(tf){ if(!LTFS.includes(tf)||tf===CFG.tf) return; const old=CFG.tf; CFG.tf=tf; saveCfg(); segUi();
  if(old!=='1m') sub('unsubscribe',[old]); if(tf!=='1m') sub('subscribe',[tf]);
  WL.bars=[]; render(WL); WL.chart.timeScale().applyOptions({barSpacing:SPACING[tf]}); return loadWin(WL).catch(e=>status('载入失败：'+e.message)); }
function segUi(){ $('w2t').textContent=TFN[CFG.tf]; for(const b of $('tfSeg').children) b.classList.toggle('on',b.dataset.tf===CFG.tf); }
function cfgUi(){ for(const el of document.querySelectorAll('[data-k]')){ const k=el.dataset.k; if(el.type==='checkbox') el.checked=!!CFG[k]; else el.value=CFG[k]; } }
function applyCfg(k){ saveCfg(); if(k==='rows'||k==='va'||k==='vp'||k==='vaLines'){ CFGV++; PC.clear(); if(k==='vp'&&CFG.vp) ensure(); } if(k==='ma'||k==='maN') for(const w of WS) setMa(w); for(const w of WS){ w.sig=''; w.lgDirty=true; } }
function setNum(k,v){ const [lo,hi]=LIMS[k]; v=Math.round(Math.min(hi,Math.max(lo,+v))); if(!isFinite(v)) v=CFG[k]; if(v!==CFG[k]){ CFG[k]=v; applyCfg(k); } cfgUi(); }
function initUi(){ $('tfSeg').innerHTML=LTFS.map(t=>`<button data-tf="${t}">${TFS[t]}</button>`).join(''); $('tfSeg').onclick=e=>{ const b=e.target.closest('button'); if(b) setTf(b.dataset.tf); }; segUi(); cfgUi();
  const open=v=>$('scrim').classList.toggle('open',v); $('setBtn').onclick=()=>open(true); $('setDone').onclick=()=>open(false); $('scrim').onclick=e=>{ if(e.target.id==='scrim') open(false); };
  addEventListener('keydown',e=>{ if(e.key==='Escape') open(false); });
  for(const el of document.querySelectorAll('[data-k]')) el.addEventListener('change',()=>{ const k=el.dataset.k; if(el.type==='checkbox'){ CFG[k]=el.checked; applyCfg(k); } else setNum(k,el.value); });
  for(const b of document.querySelectorAll('[data-f]')) b.onclick=()=>setNum(b.dataset.f,CFG[b.dataset.f]+(+b.dataset.d));
  $('reset').onclick=()=>{ const tf=CFG.tf; CFG=Object.assign({},DEF,{tf}); cfgUi(); CFGV++; PC.clear(); applyCfg('maN'); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme); }
function applyTheme(){ T=readTheme(); for(const w of WS){ w.chart.applyOptions(chartOpts()); w.cs.applyOptions({upColor:T.up,downColor:T.dn,wickUpColor:T.up,wickDownColor:T.dn}); w.ma.applyOptions({color:T.accent}); w.vs.setData(w.bars.map(vBar)); w.sig=''; } }

// ---------- 启动 ----------
let WH, WL, WS=[], READY=false;
function loadScript(src){ return new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); }); }
async function boot(){
  if(!window.LightweightCharts){ try{ await loadScript('https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js'); }catch(e){ status('图表库载入失败'); return; } }
  WH=mkWin('h',$('w1'),()=>'1H',14); WL=mkWin('l',$('w2'),()=>CFG.tf,SPACING[CFG.tf]); WS=[WH,WL]; initUi(); requestAnimationFrame(loop);
  status('载入中…'); ticker(); setInterval(ticker,300000);
  try{ const [m]=await Promise.all([latest('1m',300),loadWin(WH),loadWin(WL)]); M1.bars=merge(m,M1.bars); M1.ver++; if(M1.bars.length) price(M1.bars[M1.bars.length-1].c); }
  catch(e){ status('载入失败：'+e.message); console.warn(e); }
  READY=true; connect(); status(''); ensure(); }
window.__vp={get WH(){return WH;},get WL(){return WL;},M1,PC,prof,get CFG(){return CFG;},VPC,setTf,get READY(){return READY;},get ws(){return ws;}};
boot();

</script>
</body>
